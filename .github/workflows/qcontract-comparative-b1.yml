name: QContract comparative B1
on:
  pull_request:
    paths:
      - 'benchmarks/qcontract/**'
      - '.github/workflows/qcontract-comparative-b1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    strategy:
      fail-fast: false
      matrix:
        suite: [clifford,state,near-clifford,state-batch,design]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      SOURCE_DATE_EPOCH: 1700000000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build isolated candidate
        run: |
          python -m pip install maturin==1.9.6 setuptools==80.9.0 wheel==0.45.1
          mkdir -p b1/native b1/python
          python research/native_contract_engine/alpha/stage_native.py b1/crate > b1/native-stage.json
          (cd b1/crate && python -m maturin build --release --locked --interpreter python --compatibility manylinux_2_34 --out ../native)
          python research/native_contract_engine/stage_alpha.py b1/staged > b1/stage.json
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir b1/python b1/staged
          python -m venv b1/venv
          b1/venv/bin/python -m pip install -c constraints/linux-py312.txt b1/native/*.whl b1/python/*.whl pauli-prop==0.2.1
          b1/venv/bin/python -m pip check
          git rev-parse HEAD > b1/commit.txt
          lscpu > b1/host.txt
          b1/venv/bin/python -m pip freeze > b1/environment.txt
      - name: Run matched benchmark
        run: |
          case "${{ matrix.suite }}" in
            state-batch) b1/venv/bin/python -I benchmarks/qcontract/state_batch_b2.py > b1/result.json ;;
            design)
              b1/venv/bin/python -I benchmarks/qcontract/contract_language_lab.py > b1/result.json
              b1/venv/bin/python -I benchmarks/qcontract/ci_inventory.py > b1/ci-inventory.json ;;
            *) b1/venv/bin/python -I benchmarks/qcontract/compare_b1.py "${{ matrix.suite }}" > b1/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qcontract-b1-${{ matrix.suite }}
          path: |
            b1/*.json
            b1/*.txt

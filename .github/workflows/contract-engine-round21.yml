name: Research master contract roadmap R21
on:
  pull_request:
    paths:
      - 'research/native_contract_engine/**'
      - '.github/workflows/contract-engine-round21.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        suite: [composition,dag,recovery,algorithms,native,external,distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install maturin==1.9.6
          cd research/native_contract_engine/pyo3
          python -m maturin build --release --locked --interpreter python --compatibility off --out ../../../lab-wheels
          cd ../../..
          python research/native_contract_engine/wheel_audit10.py lab-wheels > wheel-audit.json
          python -m pip install --no-deps lab-wheels/*.whl
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          git rev-parse HEAD > commit.txt
          python -m pip freeze > environment.txt
          lscpu > host.txt
          case "${{ matrix.suite }}" in
            external)
              python -m pip install -c constraints/linux-py312.txt stim==1.16.0 mqt.qcec==3.8.0
              python -m pip check
              python -m pip freeze > environment.txt
              python research/native_contract_engine/external21.py > lab.json
              ;;
            distribution)
              python -m pip inspect > python-dependencies.json
              export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
              cd research/native_contract_engine/pyo3
              cargo metadata --locked --format-version 1 > ../../../rust-dependencies.json
              CARGO_TARGET_DIR="$RUNNER_TEMP/ketary-repro-a" python -m maturin build --release --locked --interpreter python --compatibility off --out ../../../repro-a
              CARGO_TARGET_DIR="$RUNNER_TEMP/ketary-repro-b" python -m maturin build --release --locked --interpreter python --compatibility off --out ../../../repro-b
              cd ../../..
              python -c 'import json,hashlib,pathlib; a=next(pathlib.Path("repro-a").glob("*.whl")); b=next(pathlib.Path("repro-b").glob("*.whl")); ha=hashlib.sha256(a.read_bytes()).hexdigest(); hb=hashlib.sha256(b.read_bytes()).hexdigest(); print(json.dumps({"sha_a":ha,"sha_b":hb,"byte_identical":ha==hb,"scope":"same host independent target dirs; diagnostic only"}))' > lab.json
              ;;
            *) python research/native_contract_engine/front_master21.py "${{ matrix.suite }}" > lab.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: master21-${{ matrix.suite }}
          path: |
            lab.json
            commit.txt
            wheel-audit.json
            environment.txt
            host.txt
            python-dependencies.json
            rust-dependencies.json

name: Full candidate platform qualification
on:
  pull_request:
    paths:
      - '.github/workflows/full-platform-qualification.yml'
      - 'tools/platform_distribution_probe.py'
      - 'docs/production-platform-full.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Core environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip freeze > core-platform-environment.txt
          git rev-parse HEAD > platform-revision.txt
          python -c "import platform,sys; print(platform.platform(),sys.version)"
      - name: Full Core and typing suite
        run: |
          python -m mypy --strict --follow-imports=silent --ignore-missing-imports tests/typing/consumer.py
          python -m coverage run --branch --source=ketary -m pytest -q -rs tests research/probes --junitxml=core-platform-results.xml
          python -m coverage report -m
          python -m coverage json -o core-platform-coverage.json
      - name: Dynamic environment
        run: |
          python -m pip install -e ".[dynamic]"
          python -m pip check
          python -m pip freeze > dynamic-platform-environment.txt
      - name: Full Dynamic suite
        run: |
          python -m coverage run --branch --source=ketary -m pytest -q -rs tests research/probes tests_dynamic --junitxml=dynamic-platform-results.xml
          python -m coverage report -m
          python -m coverage json -o dynamic-platform-coverage.json
      - name: Build and isolated installation probes
        run: |
          python -m pip install build==1.6.1 twine==7.0.0 setuptools==84.2.1 wheel==0.48.0
          python -m build --no-isolation
          python -m twine check dist/*
          python tools/check_distribution.py
          python tools/platform_distribution_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-platform-${{ matrix.os }}
          path: |
            *-platform-environment.txt
            platform-revision.txt
            *-platform-results.xml
            *-platform-coverage.json
            platform-distribution-probe.json
            distribution-manifest.json

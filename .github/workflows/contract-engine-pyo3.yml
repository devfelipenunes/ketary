name: Research Rust Python contract extension
on:
  pull_request:
    paths:
      - 'research/native_contract_engine/**'
      - '.github/workflows/contract-engine-pyo3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Build and install research wheel
        run: |
          python -m pip install maturin==1.9.6
          cd research/native_contract_engine/pyo3
          cargo tree --locked > ../../../cargo-tree.txt
          cargo metadata --locked --format-version 1 > ../../../cargo-metadata.json
          rustc --version > ../../../rust-version.txt
          python -m maturin build --release --locked --interpreter python --compatibility off --out ../../../native-wheels
          cd ../../..
          python research/native_contract_engine/wheel_audit10.py native-wheels > wheel-audit.json
          python -m pip install --no-deps native-wheels/*.whl
          python -m pip check
          git rev-parse HEAD > commit.txt
          cp research/native_contract_engine/pyo3/Cargo.lock cargo-resolved.lock
          python -c 'import hashlib,pathlib,json;print(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path("native-wheels").glob("*.whl")}))' > wheel-sha256.json
          cp research/native_contract_engine/smoke9.py "${RUNNER_TEMP}/smoke9.py"
          cd "${RUNNER_TEMP}"
          python smoke9.py
      - name: Test real Ketary contracts and benchmark Linux
        if: runner.os == 'Linux'
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip freeze > environment.txt
          lscpu > host.txt
          python research/native_contract_engine/front_native9.py > native-contract-round9.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-python-${{ matrix.os }}
          path: |
            native-wheels/*.whl
            cargo-resolved.lock
            cargo-tree.txt
            cargo-metadata.json
            rust-version.txt
            wheel-sha256.json
            wheel-audit.json
            commit.txt
            environment.txt
            host.txt
            native-contract-round9.json

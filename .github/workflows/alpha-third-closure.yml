name: Alpha third-round mathematical and performance diagnostics
on:
  pull_request:
    paths:
      - 'research/alpha_third_rss.py'
      - 'tests/test_alpha_third_closure.py'
      - '.github/workflows/alpha-third-closure.yml'
  push:
    branches: [main]
    paths:
      - 'research/alpha_third_rss.py'
      - 'tests/test_alpha_third_closure.py'
      - '.github/workflows/alpha-third-closure.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [83119, 83131, 83171]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip freeze > environment.txt
      - run: |
          python -m pytest -q tests/test_alpha_third_closure.py
          python -m research.parameter_workflow --seed ${{ matrix.seed }} --reps 3 --output parameter-workflow.json
          python -m research.longitudinal_benchmark --smoke --repetitions 5 --seed ${{ matrix.seed }} > longitudinal-smoke.json
      - if: matrix.seed == 83119
        run: python -m research.alpha_third_rss > retained-state-rss.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alpha-third-${{ matrix.seed }}
          path: |
            environment.txt
            parameter-workflow.json
            longitudinal-smoke.json
            retained-state-rss.json

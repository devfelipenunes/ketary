name: Competitive SDK idiomatic workflows
on:
  pull_request:
    paths:
      - 'research/competitive_idiomatic.py'
      - '.github/workflows/competitive-idiomatic.yml'
      - 'docs/competitive-idiomatic.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [1101, 2202, 3303]
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      RAYON_NUM_THREADS: 1
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Research-only dependencies
        run: |
          python -m pip install 'numpy==2.5.5' 'scipy==1.18.1' 'qiskit==2.6.2' 'cirq-core==1.7.0' 'pennylane==0.45.1'
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip freeze > environment.txt
          lscpu > host.txt
          git rev-parse HEAD > commit.txt
      - name: Analytic oracles and randomized end-to-end observations
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" python research/competitive_idiomatic.py --seed "$SEED" --repetitions 30 > idiomatic.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: competitive-idiomatic-${{ matrix.seed }}
          path: |
            idiomatic.json
            environment.txt
            host.txt
            commit.txt

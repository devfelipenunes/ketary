name: Language intent corpus
on:
  pull_request:
    paths:
      - 'research/language_corpus.py'
      - 'tests/test_language_corpus.py'
      - 'tests/test_language_promotions.py'
      - '.github/workflows/language-intent.yml'
      - 'src/ketary/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  language:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip freeze > environment.txt
          git rev-parse HEAD > revision.txt
      - run: python -m pytest -q tests/test_language_corpus.py tests/test_language_promotions.py
      - run: python -m research.language_corpus --output language-corpus.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: language-intent
          path: |
            language-corpus.json
            environment.txt
            revision.txt

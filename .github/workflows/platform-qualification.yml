name: Candidate platform compatibility
on:
  pull_request:
    paths:
      - '.github/workflows/platform-qualification.yml'
      - 'pyproject.toml'
      - 'src/ketary/**'
      - 'tests/test_production_approx_geometry.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install candidate on this platform
        run: |
          python -m pip install ".[test]"
          python -m pip check
          python -m pip freeze > platform-environment.txt
          python -c "import platform,sys; print(platform.platform(),sys.version)"
          git rev-parse HEAD > platform-revision.txt
      - name: Mathematical and API smoke tests
        run: python -m pytest -q -rs tests/test_production_math_oracles.py tests/test_production_dense_and_dynamic.py tests/test_dx_coverage_promotions.py tests/test_production_approx_geometry.py tests/test_prealpha_api.py --junitxml=platform-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: platform-${{ matrix.os }}
          path: |
            platform-environment.txt
            platform-revision.txt
            platform-results.xml

name: Declared mathematical mutation qualification
on:
  pull_request:
    paths:
      - 'research/production_mutations.py'
      - '.github/workflows/production-mutations.yml'
      - 'src/ketary/**'
      - 'tests/test_production_math_oracles.py'
      - 'tests/test_dx_coverage_promotions.py'
      - 'tests/test_dx_execution_coverage.py'
      - 'tests/test_production_controlled_gradient.py'
      - 'tests/test_production_pauli_robustness.py'
      - 'tests/test_production_channels_complex.py'
      - 'tests/test_production_nested_dynamic.py'
      - 'tests/test_production_qgt.py'
      - 'tests/test_production_hessian.py'
      - 'tests/test_production_native_faults.py'
      - 'tests/test_production_mutation_evidence.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install -c constraints/linux-py312.txt -e '.[dynamic]'
          python -m pip freeze > mutation-environment.txt
          git rev-parse HEAD > mutation-revision.txt
      - run: python -m research.production_mutations --output mutation-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-qualification
          path: |
            mutation-results.json
            mutation-environment.txt
            mutation-revision.txt

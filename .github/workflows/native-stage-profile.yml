name: Native stage attribution
on:
  pull_request:
    paths:
      - 'research/native_stage_profile.py'
      - 'tests/test_native_stage_profile.py'
      - 'research/angle_validation_cost.py'
      - 'tests/test_angle_validation_cost.py'
      - '.github/workflows/native-stage-profile.yml'
      - 'src/ketary/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [1101,2202,3303]
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip freeze > environment.txt
          lscpu > host.txt
          git rev-parse HEAD > revision.txt
      - run: python -m pytest -q tests/test_native_stage_profile.py tests/test_angle_validation_cost.py
      - run: python -m research.native_stage_profile --output native-stages.json --seed "$SEED"
      - run: python -m research.angle_validation_cost --output angle-validation.json --seed "$SEED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-stages-${{ matrix.seed }}
          path: |
            native-stages.json
            angle-validation.json
            environment.txt
            host.txt
            revision.txt

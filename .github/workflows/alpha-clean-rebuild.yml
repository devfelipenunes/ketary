name: Alpha clean rebuild qualification
on:
  pull_request:
    paths:
      - 'research/alpha_rebuild_compare.py'
      - 'tests/test_alpha_rebuild_compare.py'
      - '.github/workflows/alpha-clean-rebuild.yml'
  push:
    branches: [main]
    paths:
      - 'research/alpha_rebuild_compare.py'
      - 'tests/test_alpha_rebuild_compare.py'
      - '.github/workflows/alpha-clean-rebuild.yml'
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install build==1.6.1 setuptools==84.2.1 wheel==0.48.0
          python -m pip freeze > rebuild-environment.txt
          python -m research.alpha_rebuild_compare > clean-rebuild.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alpha-clean-rebuild
          path: |
            clean-rebuild.json
            rebuild-environment.txt

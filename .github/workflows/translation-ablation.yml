name: Translation ablation research
on:
  pull_request:
    paths:
      - 'research/translation_ablation.py'
      - '.github/workflows/translation-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [algorithms,gates,corpus]
        seed: [1101,2202,3303]
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      RAYON_NUM_THREADS: 1
      QUEST_COMMIT: 9d7618d7263e3bfba433b88cf1eac0647f08fa0a
      SUITE: ${{ matrix.suite }}
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Prepare pinned native engines
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install -c constraints/linux-py312.txt qiskit-aer==0.18.4
          python -m pip install --no-deps -e .
          python -m pip install 'setuptools>=77' wheel
          python -m pip install --no-build-isolation --no-deps ./research/qiskit_capi
          git init "$RUNNER_TEMP/quest"
          git -C "$RUNNER_TEMP/quest" remote add origin https://github.com/QuEST-Kit/QuEST.git
          git -C "$RUNNER_TEMP/quest" fetch --depth=1 origin "$QUEST_COMMIT"
          git -C "$RUNNER_TEMP/quest" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/quest" rev-parse HEAD)" = "$QUEST_COMMIT"
          cmake -S research/quest_native -B "$RUNNER_TEMP/quest-build" -DQUEST_SOURCE="$RUNNER_TEMP/quest" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/quest-build" --target ketary_quest_probe --parallel 2
          lscpu > host.txt
          python -m pip freeze > environment.txt
          git rev-parse HEAD > commit.txt
          git -C "$RUNNER_TEMP/quest" rev-parse HEAD > quest-commit.txt
      - name: Strict basis and negative controls plus paired ablation
        run: |
          flags=(--suite "$SUITE" --seed "$SEED" --repetitions 15 --library "$RUNNER_TEMP/quest-build/libketary_quest_probe.so" --output evidence.json)
          if [ "$SUITE" = corpus ]; then
            python research/translation_ablation.py --fetch-corpus "$RUNNER_TEMP/corpus"
            flags+=(--corpus-root "$RUNNER_TEMP/corpus")
          fi
          python research/translation_ablation.py "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ablation-${{ matrix.suite }}-${{ matrix.seed }}
          path: |
            evidence.json
            host.txt
            environment.txt
            commit.txt
            quest-commit.txt

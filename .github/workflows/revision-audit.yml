name: Paired revision audit
on:
  pull_request:
    paths:
      - 'research/revision_comparison.py'
      - 'research/longitudinal_benchmark.py'
      - 'research/agent_task_suite.py'
      - '.github/workflows/revision-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [1101, 2202, 3303]
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      RAYON_NUM_THREADS: 1
      BASELINE: ecc84a5a582303f216193685f023d1f9e9c745da
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Isolate pinned revisions
        run: |
          git worktree add --detach "$RUNNER_TEMP/ketary-before" "$BASELINE"
          python -m venv "$RUNNER_TEMP/before-env"
          python -m venv "$RUNNER_TEMP/after-env"
          for variant in before after; do
            dir="$GITHUB_WORKSPACE"
            if [ "$variant" = before ]; then dir="$RUNNER_TEMP/ketary-before"; fi
            (
              cd "$dir"
              "$RUNNER_TEMP/$variant-env/bin/python" -m pip install -c constraints/linux-py312.txt -r requirements.txt
              "$RUNNER_TEMP/$variant-env/bin/python" -m pip install --no-deps -e .
              "$RUNNER_TEMP/$variant-env/bin/python" -m pip freeze > "$GITHUB_WORKSPACE/$variant-environment.txt"
            )
          done
          uname -a > host.txt
          lscpu >> host.txt
          free -h >> host.txt
      - name: Run reference tasks and counterbalanced revision benchmarks
        run: |
          "$RUNNER_TEMP/after-env/bin/python" research/agent_task_suite.py > agent-reference-results.json
          cat agent-reference-results.json
          order="before after"
          if [ "$((SEED % 2))" = 0 ]; then order="after before"; fi
          echo "$order" > revision-order.txt
          for variant in $order; do
            dir="$GITHUB_WORKSPACE"
            if [ "$variant" = before ]; then dir="$RUNNER_TEMP/ketary-before"; fi
            (
              cd "$dir"
              "$RUNNER_TEMP/$variant-env/bin/python" research/longitudinal_benchmark.py --seed "$SEED" --repetitions 30 > "$GITHUB_WORKSPACE/$variant.json"
            )
          done
          "$RUNNER_TEMP/after-env/bin/python" research/revision_comparison.py before.json after.json > comparison.json
          cat comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: revision-audit-${{ matrix.seed }}
          path: |
            before.json
            after.json
            comparison.json
            before-environment.txt
            after-environment.txt
            host.txt
            revision-order.txt
            agent-reference-results.json

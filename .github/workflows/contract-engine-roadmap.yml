name: Research reusable contract roadmap
on:
  pull_request:
    paths:
      - 'research/native_contract_engine/**'
      - '.github/workflows/contract-engine-roadmap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install maturin==1.9.6
          cd research/native_contract_engine/pyo3
          python -m maturin build --release --locked --interpreter python --compatibility off --out ../../../lab-wheels
          cd ../../..
          python research/native_contract_engine/wheel_audit10.py lab-wheels > wheel-audit.json
          git rev-parse HEAD > commit.txt
          sha256sum lab-wheels/*.whl > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-engine-roadmap-shared-linux-wheel
          path: |
            lab-wheels/*.whl
            wheel-audit.json
            commit.txt
            SHA256SUMS
          if-no-files-found: error
  suite:
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        suite: [projection,composition,channels,arithmetic,qec]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: contract-engine-roadmap-shared-linux-wheel
          path: .
      - run: |
          python -m pip install maturin==1.9.6
          test "$(git rev-parse HEAD)" = "$(cat commit.txt)"
          sha256sum -c SHA256SUMS
          python research/native_contract_engine/wheel_audit10.py lab-wheels > wheel-audit.json
          python -m pip install --no-deps lab-wheels/*.whl
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          git rev-parse HEAD > commit.txt
          python -m pip freeze > environment.txt
          lscpu > host.txt
          python research/native_contract_engine/front_roadmap15.py ${{ matrix.suite }} > lab.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: roadmap-${{ matrix.suite }}
          path: |
            lab.json
            commit.txt
            wheel-audit.json
            environment.txt
            host.txt

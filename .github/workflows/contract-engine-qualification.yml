name: Research contract engine qualification
on:
  pull_request:
    paths:
      - 'research/native_contract_engine/**'
      - '.github/workflows/contract-engine-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, suite: algorithms}
          - {os: ubuntu-latest, suite: subspace}
          - {os: ubuntu-latest, suite: memory}
          - {os: ubuntu-latest, suite: cross}
          - {os: windows-latest, suite: cross}
          - {os: macos-latest, suite: cross}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Locked wheel, isolated installation
        run: |
          python -m pip install maturin==1.9.6
          cd research/native_contract_engine/pyo3
          cargo metadata --locked --format-version 1 > ../../../cargo-metadata.json
          rustc --version > ../../../rust-version.txt
          python -m maturin build --release --locked --interpreter python --compatibility off --out ../../../qualification-wheels
          cd ../../..
          python research/native_contract_engine/wheel_audit10.py qualification-wheels > wheel-audit.json
          python -m pip install --no-deps qualification-wheels/*.whl
          git rev-parse HEAD > commit.txt
          python -c 'import hashlib,pathlib,json;print(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path("qualification-wheels").glob("*.whl")}))' > wheel-sha256.json
          cp research/native_contract_engine/smoke9.py "${RUNNER_TEMP}/smoke9.py"
          cd "${RUNNER_TEMP}"
          python smoke9.py
      - name: Install real SDK with pinned scientific dependencies
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          else
            python -m pip install qiskit==2.6.2 numpy==2.5.5
          fi
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip freeze > environment.txt
          python -c 'import platform;print(platform.platform(),platform.machine(),platform.python_version())' > host.txt
      - name: Qualification suite
        run: |
          if [ "${{ matrix.suite }}" = memory ]; then
            python research/native_contract_engine/memory10.py > qualification.json
          else
            python research/native_contract_engine/front_proof10.py ${{ matrix.suite }} > qualification.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-${{ matrix.os }}-${{ matrix.suite }}
          path: |
            qualification.json
            commit.txt
            wheel-sha256.json
            wheel-audit.json
            cargo-metadata.json
            rust-version.txt
            environment.txt
            host.txt

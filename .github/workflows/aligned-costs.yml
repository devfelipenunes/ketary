name: Aligned rotation cost diagnostics
on:
  pull_request:
    paths:
      - 'src/ketary/**'
      - 'research/aligned_rotation_costs.py'
      - 'research/epic_runtime_profile.py'
      - '.github/workflows/aligned-costs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  costs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [1101,2202,3303]
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      RAYON_NUM_THREADS: 1
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip freeze > environment.txt
          lscpu > host.txt
          git rev-parse HEAD > revision.txt
      - run: python -m research.aligned_rotation_costs --output costs.json --seed "$SEED" --reps 7
      - run: |
          python -m research.epic_runtime_profile --seed "$SEED" --reps 9 > epic-runtime.json
          cat epic-runtime.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aligned-costs-${{ matrix.seed }}
          path: |
            costs.json
            epic-runtime.json
            environment.txt
            host.txt
            revision.txt

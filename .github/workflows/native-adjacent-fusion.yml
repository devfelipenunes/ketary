name: Native adjacent fusion qualification
on:
  pull_request:
    paths:
      - 'research/native_adjacent_gate_fusion.py'
      - 'tests/test_native_adjacent_gate_fusion.py'
      - '.github/workflows/native-adjacent-fusion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pytest -q tests/test_native_adjacent_gate_fusion.py
          python -m research.native_adjacent_gate_fusion --output fusion.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-fusion
          path: fusion.json

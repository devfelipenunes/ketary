name: Published circuit execution study
on:
  pull_request:
    paths:
      - 'research/published_circuit_*'
      - 'tests/test_published_circuit_study.py'
      - '.github/workflows/published-circuit-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Install pinned SDK
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Execute verified public source data
        run: |
          status=0
          python research/published_circuit_execution.py --fetch-public > published-circuit-study.json || status=$?
          cat published-circuit-study.json
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: published-circuit-study
          path: published-circuit-study.json

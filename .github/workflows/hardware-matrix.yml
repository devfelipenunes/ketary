name: Hardware performance diagnostics
on:
  pull_request:
    paths:
      - 'research/quest_hardware/**'
      - 'research/hardware_performance.py'
      - '.github/workflows/hardware-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      QUEST_COMMIT: 9d7618d7263e3bfba433b88cf1eac0647f08fa0a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install -c constraints/linux-py312.txt qiskit-aer==0.18.4
          git init "$RUNNER_TEMP/quest"
          git -C "$RUNNER_TEMP/quest" remote add origin https://github.com/QuEST-Kit/QuEST.git
          git -C "$RUNNER_TEMP/quest" fetch --depth=1 origin "$QUEST_COMMIT"
          git -C "$RUNNER_TEMP/quest" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/quest" rev-parse HEAD)" = "$QUEST_COMMIT"
          lscpu > host.txt
          c++ --version >> host.txt
          python -m pip freeze > environment.txt
          git rev-parse HEAD > commit.txt
      - name: Same-host compiler and thread matrix
        run: |
          threads="$(python -c 'import os; print(" ".join(str(t) for t in (1,2,4) if t<=len(os.sched_getaffinity(0))))')"
          for variant in portable host-native; do
            flags=""
            if [ "$variant" = host-native ]; then flags="-march=native"; fi
            cmake -S research/quest_hardware -B "$RUNNER_TEMP/$variant" -DQUEST_SOURCE="$RUNNER_TEMP/quest" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="$flags"
            cmake --build "$RUNNER_TEMP/$variant" --target ketary_hardware_probe --parallel 2
            extra=""
            if [ "$variant" = portable ]; then extra="--aer"; fi
            python research/hardware_performance.py --exe "$RUNNER_TEMP/$variant/ketary_hardware_probe" --mode cpu --threads $threads --widths 8 12 16 --repetitions 10 --label "$variant" --output "$variant.json" $extra
            cp "$RUNNER_TEMP/$variant/CMakeCache.txt" "$variant-cmake.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hardware-cpu
          path: |
            *.json
            *-cmake.txt
            host.txt
            environment.txt
            commit.txt
  mpi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      QUEST_COMMIT: 9d7618d7263e3bfba433b88cf1eac0647f08fa0a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install -c constraints/linux-py312.txt qiskit-aer==0.18.4
          git init "$RUNNER_TEMP/quest"
          git -C "$RUNNER_TEMP/quest" remote add origin https://github.com/QuEST-Kit/QuEST.git
          git -C "$RUNNER_TEMP/quest" fetch --depth=1 origin "$QUEST_COMMIT"
          git -C "$RUNNER_TEMP/quest" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/quest" rev-parse HEAD)" = "$QUEST_COMMIT"
          cmake -S research/quest_hardware -B "$RUNNER_TEMP/mpi" -DQUEST_SOURCE="$RUNNER_TEMP/quest" -DKETARY_PROBE_MPI=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/mpi" --target ketary_hardware_probe --parallel 2
          lscpu > mpi-host.txt
          mpiexec --version >> mpi-host.txt
          python -m pip freeze > mpi-environment.txt
          python research/hardware_performance.py --exe "$RUNNER_TEMP/mpi/ketary_hardware_probe" --mode mpi --threads 1 --ranks 2 --widths 8 12 --repetitions 5 --label mpi-local-smoke --output mpi.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hardware-mpi-local
          path: |
            mpi.json
            mpi-host.txt
            mpi-environment.txt

name: QContract Alpha candidate qualification
on:
  pull_request:
    paths:
      - 'research/native_contract_engine/**'
      - 'docs/qcontract-alpha-guide.md'
      - 'docs/qcontract/**'
      - '.github/workflows/qcontract-alpha.yml'
  push:
    branches: [main]
    paths:
      - 'research/native_contract_engine/**'
      - 'docs/qcontract-alpha-guide.md'
      - 'docs/qcontract/**'
      - '.github/workflows/qcontract-alpha.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04,windows-latest,macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install maturin==1.9.6 setuptools==80.9.0 wheel==0.45.1
      - name: Record Linux runtime ABI
        if: runner.os == 'Linux'
        run: |
          ldd --version
          readelf --version
      - run: python research/native_contract_engine/alpha/qualify.py
      - name: Execute documented Python examples in the qualified environment
        run: python -c "import os, pathlib, subprocess; root=pathlib.Path('qcontract-qualification'); exe=root/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); out=(root/'documentation-examples.json').open('w', encoding='utf-8'); subprocess.run([str(exe),'-I','docs/qcontract/check_examples.py'],stdout=out,check=True); out.close()"
      - name: Execute developer workflow rounds six to ten
        run: python -c "import os, pathlib, subprocess; root=pathlib.Path('qcontract-qualification'); exe=root/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); out=(root/'contract-workflow-rounds.json').open('w', encoding='utf-8'); subprocess.run([str(exe),'-I','docs/qcontract/workflow_rounds.py'],stdout=out,check=True); out.close()"
      - name: Execute scope-specific contract design review
        run: python -c "import os, pathlib, subprocess; root=pathlib.Path('qcontract-qualification'); exe=root/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); out=(root/'contract-design.json').open('w', encoding='utf-8'); subprocess.run([str(exe),'-I','docs/qcontract/design_examples.py'],stdout=out,check=True); out.close()"
      - name: Execute five contract methodology review rounds
        run: python -c "import os, pathlib, subprocess; root=pathlib.Path('qcontract-qualification'); exe=root/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); out=(root/'contract-review-rounds.json').open('w', encoding='utf-8'); subprocess.run([str(exe),'-I','docs/qcontract/review_rounds.py'],stdout=out,check=True); out.close()"
      - name: Execute practical programming rounds eleven to fifteen
        run: python -c "import os, pathlib, subprocess; root=pathlib.Path('qcontract-qualification'); exe=root/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); out=(root/'contract-practical-rounds.json').open('w', encoding='utf-8'); subprocess.run([str(exe),'-I','docs/qcontract/practical_rounds.py'],stdout=out,check=True); out.close()"
      - name: Execute modular project rounds sixteen to nineteen
        run: python -c "import os, pathlib, subprocess; root=pathlib.Path('qcontract-qualification'); exe=root/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); out=(root/'contract-project-rounds.json').open('w', encoding='utf-8'); subprocess.run([str(exe),'-I','docs/qcontract/project_example/verify.py'],stdout=out,check=True); out.close()"
      - name: Execute final API audit and matched Qiskit comparison
        run: python -c "import os, pathlib, subprocess; root=pathlib.Path('qcontract-qualification'); exe=root/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); out=(root/'contract-final-rounds.json').open('w', encoding='utf-8'); subprocess.run([str(exe),'-I','docs/qcontract/final_rounds.py'],stdout=out,check=True); out.close()"
      - name: Execute practical application portfolio
        run: python -c "import os, pathlib, subprocess; root=pathlib.Path('qcontract-qualification'); exe=root/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); out=(root/'contract-application-portfolio.json').open('w', encoding='utf-8'); subprocess.run([str(exe),'-I','docs/qcontract/applications/run_portfolio.py'],stdout=out,check=True); out.close()"
      - name: Audit integrated methodology evidence inventory
        run: python -c "import pathlib, subprocess, sys; root=pathlib.Path('qcontract-qualification'); out=(root/'contract-method-audit.json').open('w', encoding='utf-8'); subprocess.run([sys.executable,'-I','docs/qcontract/audit_method.py',str(root)],stdout=out,check=True); out.close()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qcontract-alpha-${{ matrix.os }}
          path: |
            qcontract-qualification/*.json
            qcontract-qualification/native/*.whl
            qcontract-qualification/python/*.whl

name: QContract Alpha candidate qualification
on:
  pull_request:
    paths:
      - 'research/native_contract_engine/**'
      - 'docs/qcontract-alpha-guide.md'
      - '.github/workflows/qcontract-alpha.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04,windows-latest,macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install maturin==1.9.6 setuptools==80.9.0 wheel==0.45.1
      - name: Record Linux runtime ABI
        if: runner.os == 'Linux'
        run: |
          ldd --version
          readelf --version
      - run: python research/native_contract_engine/alpha/qualify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qcontract-alpha-${{ matrix.os }}
          path: |
            qcontract-qualification/*.json
            qcontract-qualification/native/*.whl
            qcontract-qualification/python/*.whl

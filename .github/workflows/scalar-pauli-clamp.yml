name: Scalar Pauli clamp attribution
on:
  pull_request:
    paths:
      - 'src/ketary/_result.py'
      - 'research/scalar_pauli_clamp.py'
      - '.github/workflows/scalar-pauli-clamp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip freeze > clamp-environment.txt
          python -m pytest -q tests/test_scalar_pauli_clamp.py
          python -m research.scalar_pauli_clamp --output clamp-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scalar-pauli-clamp
          path: |
            clamp-results.json
            clamp-environment.txt

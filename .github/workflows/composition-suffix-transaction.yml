name: Composition suffix transaction feasibility
on:
  pull_request:
    paths:
      - 'research/composition_suffix_transaction.py'
      - 'research/probes/test_composition_suffix_transaction.py'
      - '.github/workflows/composition-suffix-transaction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip freeze > suffix-environment.txt
          python -m pytest -q research/probes/test_composition_suffix_transaction.py
          python -m research.composition_suffix_transaction --output suffix-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: suffix-results
          path: |
            suffix-results.json
            suffix-environment.txt

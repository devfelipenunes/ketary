name: Current architecture inventory
on:
  pull_request:
    paths:
      - 'research/architecture_inventory.py'
      - 'tests/test_current_architecture_inventory.py'
      - 'docs/local-import-rationales.json'
      - '.github/workflows/current-architecture-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pytest -q tests/test_architecture_inventory.py tests/test_current_architecture_inventory.py
          python -m research.architecture_inventory > architecture-inventory.json
          python -c 'import json; d=json.load(open("architecture-inventory.json")); print(json.dumps({k:d[k] for k in ("modules","physical_lines","internal_edges","eager_edges","cycles","eager_cycles","exact_duplicate_body_groups")},indent=2))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-architecture-inventory
          path: architecture-inventory.json

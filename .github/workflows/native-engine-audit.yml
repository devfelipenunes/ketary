name: Native execution engine audit
on:
  pull_request:
    paths:
      - 'research/native_execution_benchmark.py'
      - 'research/quest_probe.py'
      - 'research/quest_native/**'
      - '.github/workflows/native-engine-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 2, 4]
    env:
      OMP_NUM_THREADS: ${{ matrix.threads }}
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      RAYON_NUM_THREADS: 1
      QUEST_COMMIT: 9d7618d7263e3bfba433b88cf1eac0647f08fa0a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install -c constraints/linux-py312.txt qiskit-aer==0.18.4
          python -m pip install --no-deps -e .
          git init "$RUNNER_TEMP/quest"
          git -C "$RUNNER_TEMP/quest" remote add origin https://github.com/QuEST-Kit/QuEST.git
          git -C "$RUNNER_TEMP/quest" fetch --depth=1 origin "$QUEST_COMMIT"
          git -C "$RUNNER_TEMP/quest" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/quest" rev-parse HEAD)" = "$QUEST_COMMIT"
          cmake -S research/quest_native -B "$RUNNER_TEMP/quest-build" -DQUEST_SOURCE="$RUNNER_TEMP/quest" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/quest-build" --target ketary_quest_probe --parallel 2
          git rev-parse HEAD > commit.txt
          git -C "$RUNNER_TEMP/quest" rev-parse HEAD > quest-commit.txt
          python -m pip freeze > environment.txt
          uname -a > host.txt
          lscpu >> host.txt
          free -h >> host.txt
          c++ --version >> host.txt
      - name: Strict native preflight
        run: python research/native_execution_benchmark.py --library "$RUNNER_TEMP/quest-build/libketary_quest_probe.so" --threads ${{ matrix.threads }} --repetitions 3 --smoke > smoke.json
      - name: Long native execution diagnostic
        run: python research/native_execution_benchmark.py --library "$RUNNER_TEMP/quest-build/libketary_quest_probe.so" --threads ${{ matrix.threads }} --repetitions 30 > native-execution.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-engine-threads-${{ matrix.threads }}
          path: |
            smoke.json
            native-execution.json
            commit.txt
            quest-commit.txt
            environment.txt
            host.txt

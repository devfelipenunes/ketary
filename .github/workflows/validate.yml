name: Validate experimental SDK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Install experimental dependencies
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Record environment
        run: |
          python --version
          python -m pip freeze
          python -c "import qiskit; print(qiskit.__version__)"
      - name: Typed public consumer
        run: python -m mypy --strict --follow-imports=silent --ignore-missing-imports tests/typing/consumer.py
      - name: Required tests and upstream probes
        run: |
          python -m coverage run --branch --source=ketary -m pytest -q -rs tests research/probes --junitxml=core-test-results.xml
          python -m coverage report -m --precision=2
          python -m coverage report --precision=6 --fail-under=95
          python -m coverage json -o coverage.json
          python -m research.coverage_evidence coverage.json --scope core --baseline docs/coverage-count-baseline.json --output core-coverage-gaps.json
      - name: Verification calibration against native Qiskit
        run: |
          python research/verification_comparison.py > verification-comparison.json
          cat verification-comparison.json
          python research/public_defect_cases.py > public-defects.json
          cat public-defects.json
          python research/dx_comparison.py > dx-comparison.json
          cat dx-comparison.json
          python research/complete_workflows.py > complete-workflows.json
          cat complete-workflows.json
          python research/circuit_writing_study.py > circuit-writing-study.json
          cat circuit-writing-study.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.json
            core-coverage-gaps.json
            core-test-results.xml
            verification-comparison.json
            public-defects.json
            dx-comparison.json
            complete-workflows.json
            circuit-writing-study.json

  benchmark:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Paired timing and isolated peak RSS
        run: |
          python -m pip freeze > environment.txt
          python benchmark.py > benchmark_results.json
          cat benchmark_results.json
          python research/verification_scaling.py > verification-scaling.json
          cat verification-scaling.json
          python research/priority_sampling_rss.py --quick > priority-sampling-rss.json
          cat priority-sampling-rss.json
          python -m research.closure_sampling_pinned --quick > closure-sampling-pinned.json
          python -m research.closure_arithmetic_compare > closure-arithmetic.json
          python -m research.closure_qec_metrics > closure-qec.json
          python -m research.alpha_sweep_rss --reps 3 > alpha-sweep-rss.json
          python -m research.alpha_binding_profile --reps 9 > alpha-binding-profile.json
          python -m research.alpha_sweep_plan_profile --reps 9 > alpha-sweep-plan-profile.json
          python -m research.alpha_parity_profile --reps 9 > alpha-parity-profile.json
          python -m research.alpha_observable_reuse_profile --reps 9 > alpha-observable-reuse-profile.json
          python -m research.alpha_operator_metrics_profile --reps 5 > alpha-operator-metrics-profile.json
          python -m research.closure_physical_dynamics > closure-physical-dynamics.json
          python -m research.closure_reversible_logic > closure-reversible-logic.json
          python -m research.priority_architecture_audit > closure-architecture.json
          python -m research.architecture_inventory > architecture-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: |
            benchmark_results.json
            verification-scaling.json
            priority-sampling-rss.json
            closure-sampling-pinned.json
            closure-arithmetic.json
            closure-qec.json
            alpha-sweep-rss.json
            alpha-binding-profile.json
            alpha-sweep-plan-profile.json
            alpha-parity-profile.json
            alpha-observable-reuse-profile.json
            alpha-operator-metrics-profile.json
            closure-physical-dynamics.json
            closure-reversible-logic.json
            closure-architecture.json
            architecture-inventory.json
            environment.txt

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Inventory validation dependencies
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip check
          python tools/audit_dependencies.py
          python tools/audit_dependencies.py --scope runtime
      - name: Scan exact resolved versions
        run: |
          python -m venv audit-venv
          audit-venv/bin/python -m pip install pip-audit==2.10.1
          audit-venv/bin/python -m pip_audit --no-deps --disable-pip -r audited-requirements.txt -f json -o vulnerability-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-review-py312
          path: |
            license-inventory.json
            runtime-license-inventory.json
            runtime-audited-requirements.txt
            audited-requirements.txt
            vulnerability-report.json

  packaging:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.6.1 twine==7.0.0 setuptools==84.2.1 wheel==0.48.0
          python tools/audit_dependencies.py --scope build
          python -m build --no-isolation
          python -m twine check dist/*
          python tools/check_distribution.py
      - name: Scan resolved build tooling
        run: |
          python -m venv audit-venv
          audit-venv/bin/python -m pip install pip-audit==2.10.1
          audit-venv/bin/python -m pip_audit --no-deps --disable-pip -r build-audited-requirements.txt -f json -o build-vulnerability-report.json
      - name: Install wheel in clean environment
        run: |
          python -m venv "$RUNNER_TEMP/ketary-wheel"
          "$RUNNER_TEMP/ketary-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/ketary-wheel/bin/python" -m pip check
          cp examples/first_verification.py "$RUNNER_TEMP/first_verification.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ketary-wheel/bin/python" "$RUNNER_TEMP/first_verification.py"
          "$RUNNER_TEMP/ketary-wheel/bin/python" -c 'import ketary as q; from importlib.metadata import version; assert version("ketary") == "0.1.0.dev0"; from pathlib import Path; assert Path(q.__file__).with_name("py.typed").is_file(); assert Path(q.__file__).with_name("__init__.pyi").is_file(); assert q.bell().run().test.probability("00", 0.5).status == "PASS"; print(q.__file__)'
      - name: Install dynamic extra from wheel in clean environment
        run: |
          python -m venv "$RUNNER_TEMP/ketary-dynamic-wheel"
          wheel=$(realpath dist/*.whl)
          "$RUNNER_TEMP/ketary-dynamic-wheel/bin/python" -m pip install "$wheel[dynamic]"
          "$RUNNER_TEMP/ketary-dynamic-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ketary-dynamic-wheel/bin/python" -c 'import ketary as q; c=q.Circuit.classical(1,1).x(0).measure(0,0); assert c.run_shots(shots=8,seed=1).counts == {"1":8}'
      - name: Install source distribution in clean environment
        run: |
          python -m venv "$RUNNER_TEMP/ketary-sdist"
          "$RUNNER_TEMP/ketary-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/ketary-sdist/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ketary-sdist/bin/python" -c 'import ketary as q; assert q.ghz(3).run().test.probability("111", 0.5).status == "PASS"; print(q.__file__)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-distributions
          path: |
            dist/*
            distribution-manifest.json
            build-license-inventory.json
            build-audited-requirements.txt
            build-vulnerability-report.json

  dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Install and verify optional dynamic extra
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install -c constraints/linux-py312.txt -e '.[dynamic]'
          python -m pip check
          python tools/audit_dependencies.py --scope dynamic
          python -m pip freeze > dynamic-environment.txt
          python -m coverage run --branch --source=ketary -m pytest -q -rs tests research/probes tests_dynamic --junitxml=dynamic-test-results.xml
          python -m coverage report -m --precision=2
          python -m coverage report --precision=6 --fail-under=95
          python -m coverage json -o dynamic-coverage.json
          python -m research.coverage_evidence dynamic-coverage.json --scope dynamic --baseline docs/coverage-count-baseline.json --output dynamic-coverage-gaps.json
      - name: Matched local protocol diagnostics
        run: python -m research.wave1_dynamic_protocols > wave1-dynamic-protocols.json
      - name: Audit dynamic dependencies
        run: |
          python -m venv audit-venv
          audit-venv/bin/python -m pip install pip-audit==2.10.1
          audit-venv/bin/python -m pip_audit --no-deps --disable-pip -r dynamic-audited-requirements.txt -f json -o dynamic-vulnerability-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dynamic-validation
          path: |
            dynamic-environment.txt
            dynamic-coverage.json
            dynamic-coverage-gaps.json
            dynamic-test-results.xml
            wave1-dynamic-protocols.json
            dynamic-license-inventory.json
            dynamic-audited-requirements.txt
            dynamic-vulnerability-report.json

  external-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Install isolated experimental QCEC comparison dependencies
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install -c constraints/linux-py312.txt 'mqt.qcec[qiskit]==3.12.0'
          python -m pip check
          python tools/audit_dependencies.py --scope external
          python -m pip freeze > external-environment.txt
      - name: Native QCEC smoke and matched calibration
        run: |
          python -m pytest -q tests_external
          python research/verification_comparison.py --external > external-comparison.json
          cat external-comparison.json
          python research/verification_scaling.py --external > external-scaling.json
          cat external-scaling.json
      - name: Audit external comparison dependencies
        run: |
          python -m venv audit-venv
          audit-venv/bin/python -m pip install pip-audit==2.10.1
          audit-venv/bin/python -m pip_audit --no-deps --disable-pip -r external-audited-requirements.txt -f json -o external-vulnerability-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-verification
          path: |
            external-environment.txt
            external-comparison.json
            external-scaling.json
            external-license-inventory.json
            external-audited-requirements.txt
            external-vulnerability-report.json

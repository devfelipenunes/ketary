name: Validate experimental SDK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install experimental dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Record environment
        run: |
          python --version
          python -m pip freeze
          python -c "import qiskit; print(qiskit.__version__)"
      - name: Typed public consumer
        run: python -m mypy --strict --follow-imports=silent --ignore-missing-imports tests/typing/consumer.py
      - name: Required tests and upstream probes
        run: |
          python -m coverage run --branch --source=ketary -m pytest -q -rs tests research/probes
          python -m coverage report -m
          python -m coverage json -o coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json

  benchmark:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Paired timing and isolated peak RSS
        run: |
          python -m pip freeze > environment.txt
          python benchmark.py > benchmark_results.json
          cat benchmark_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results.json
            environment.txt

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Inventory validation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python tools/audit_dependencies.py
      - name: Scan exact resolved versions
        run: |
          python -m venv audit-venv
          audit-venv/bin/python -m pip install pip-audit
          audit-venv/bin/python -m pip_audit --no-deps --disable-pip -r audited-requirements.txt -f json -o vulnerability-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-review-py312
          path: |
            license-inventory.json
            audited-requirements.txt
            vulnerability-report.json

  packaging:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv "$RUNNER_TEMP/ketary-wheel"
          "$RUNNER_TEMP/ketary-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/ketary-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ketary-wheel/bin/python" -c 'import ketary as q; from importlib.metadata import version; assert version("ketary") == "0.1.0.dev0"; from pathlib import Path; assert Path(q.__file__).with_name("py.typed").is_file(); assert Path(q.__file__).with_name("__init__.pyi").is_file(); assert q.bell().run().test.probability("00", 0.5).status == "PASS"; print(q.__file__)'
      - name: Install source distribution in clean environment
        run: |
          python -m venv "$RUNNER_TEMP/ketary-sdist"
          "$RUNNER_TEMP/ketary-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/ketary-sdist/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ketary-sdist/bin/python" -c 'import ketary as q; assert q.ghz(3).run().test.probability("111", 0.5).status == "PASS"; print(q.__file__)'
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-distributions
          path: dist/*

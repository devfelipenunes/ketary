name: Research contract engine round seven
on:
  pull_request:
    paths:
      - 'research/native_contract_engine/**'
      - '.github/workflows/contract-engine-round7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        front: [a,b,c]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - run: |
          git rev-parse HEAD > commit.txt
          python -m pip freeze > environment.txt
          lscpu > host.txt
          python research/native_contract_engine/front_${{ matrix.front }}7.py > round7-${{ matrix.front }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round7-${{ matrix.front }}
          path: |
            round7-${{ matrix.front }}.json
            commit.txt
            environment.txt
            host.txt

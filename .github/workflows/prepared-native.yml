name: Prepared native batch research
on:
  pull_request:
    paths:
      - 'research/prepared_native*.py'
      - 'research/quest_probe.py'
      - 'research/quest_native/**'
      - '.github/workflows/prepared-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      RAYON_NUM_THREADS: 1
      QUEST_COMMIT: 9d7618d7263e3bfba433b88cf1eac0647f08fa0a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install pinned dependencies and native source
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install -c constraints/linux-py312.txt qiskit-aer==0.18.4
          python -m pip install --no-deps -e .
          python -m pip install 'setuptools>=77' wheel
          python -m pip install --no-build-isolation --no-deps ./research/qiskit_capi
          git init "$RUNNER_TEMP/quest"
          git -C "$RUNNER_TEMP/quest" remote add origin https://github.com/QuEST-Kit/QuEST.git
          git -C "$RUNNER_TEMP/quest" fetch --depth=1 origin "$QUEST_COMMIT"
          git -C "$RUNNER_TEMP/quest" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/quest" rev-parse HEAD)" = "$QUEST_COMMIT"
          lscpu > host.txt
          lscpu -C >> host.txt
          c++ --version >> host.txt
          python -m pip freeze > environment.txt
          git rev-parse HEAD > commit.txt
      - name: Same-host portable and host-native comparisons
        run: |
          for variant in portable host-native; do
            flags=""
            if [ "$variant" = host-native ]; then flags="-march=native"; fi
            cmake -S research/quest_native -B "$RUNNER_TEMP/$variant" -DQUEST_SOURCE="$RUNNER_TEMP/quest" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="$flags"
            cmake --build "$RUNNER_TEMP/$variant" --target ketary_quest_probe --parallel 2
            python research/prepared_native_benchmark.py --library "$RUNNER_TEMP/$variant/libketary_quest_probe.so" --repetitions 10 --widths 4 8 12 16 --output "$variant.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prepared-native-comparison
          path: |
            portable.json
            host-native.json
            host.txt
            environment.txt
            commit.txt

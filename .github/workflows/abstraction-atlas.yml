name: Abstraction opportunity atlas
on:
  pull_request:
    paths:
      - 'research/abstraction*.py'
      - 'tests/test_abstraction_primitives.py'
      - 'tests/test_abstraction_advanced.py'
      - '.github/workflows/abstraction-atlas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [1101,2202,3303]
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      RAYON_NUM_THREADS: 1
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install pinned environment
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install -c constraints/linux-py312.txt qiskit-aer==0.18.4
          python -m pip install --no-deps -e .
          python -m pip freeze > environment.txt
          lscpu > host.txt
          git rev-parse HEAD > revision.txt
      - name: Independent and native mathematical controls
        run: python -m pytest -q tests/test_abstraction_primitives.py tests/test_abstraction_advanced.py
      - name: Matched source and timing atlas
        run: python -m research.abstraction_atlas --output atlas.json --seed "$SEED" --repetitions 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: abstraction-atlas-${{ matrix.seed }}
          path: |
            atlas.json
            environment.txt
            host.txt
            revision.txt

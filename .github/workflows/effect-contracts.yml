name: Research effect contracts and witnesses
on:
  pull_request:
    paths:
      - 'research/effect_contracts.py'
      - 'research/test_effect_contracts.py'
      - 'docs/effect-contracts-poc.md'
      - '.github/workflows/effect-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install pinned SDK
        run: |
          python -m pip install -c constraints/linux-py312.txt -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip freeze > environment.txt
          git rev-parse HEAD > commit.txt
      - name: Check analytic controls and actual Ketary adapter
        run: |
          python -m unittest discover -s research -p test_effect_contracts.py -v
          python research/effect_contracts.py > effect-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: effect-contract-evidence
          path: |
            effect-results.json
            environment.txt
            commit.txt

[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "ketary-native-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Private research prototype of bounded exact quantum verification kernels"
license = "Apache-2.0"

[tool.maturin]
bindings = "pyo3"
module-name = "ketary_native_research"
